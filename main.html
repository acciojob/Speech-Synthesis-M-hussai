<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text-to-Speech Application</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    .field-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      font-size: 1rem;
    }

    select, input[type="range"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* Dedicated Status Message Alert */
    .status-message {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      display: none;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #speak-btn {
      background-color: #28a745;
      color: white;
    }

    #speak-btn:hover {
      background-color: #218838;
    }

    #stop-btn {
      background-color: #dc3545;
      color: white;
    }

    #stop-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Speech Synthesis</h1>

    <!-- Dedicated UI Status Message Box -->
    <div id="voice-message" class="status-message"></div>

    <div class="field-group">
      <label for="text-input">Enter Text:</label>
      <textarea id="text-input" placeholder="Type text here to speak..."></textarea>
    </div>

    <div class="field-group">
      <label for="voice-select">Select Voice:</label>
      <select id="voice-select">
        <option value="">Select a voice</option>
      </select>
    </div>

    <div class="field-group">
      <label for="rate">Rate (<span id="rate-val">1</span>):</label>
      <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
    </div>

    <div class="field-group">
      <label for="pitch">Pitch (<span id="pitch-val">1</span>):</label>
      <input type="range" id="pitch" min="0" max="2" value="1" step="0.1">
    </div>

    <div class="controls">
      <button id="speak-btn">Speak</button>
      <button id="stop-btn">Stop</button>
    </div>
  </div>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];

    // DOM Elements
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const voiceMessage = document.getElementById('voice-message');
    const rateInput = document.getElementById('rate');
    const pitchInput = document.getElementById('pitch');
    const rateVal = document.getElementById('rate-val');
    const pitchVal = document.getElementById('pitch-val');
    const speakBtn = document.getElementById('speak-btn');
    const stopBtn = document.getElementById('stop-btn');

    // Populate Voice Dropdown & Handle UI Notification
    function populateVoiceList() {
      voices = synth.getVoices();

      if (voices.length === 0) {
        // Display separate error banner message
        voiceMessage.textContent = 'No speech synthesis voices are currently available on this device or browser.';
        voiceMessage.className = 'status-message error';
        voiceSelect.innerHTML = '<option value="">No voices available</option>';
        voiceSelect.disabled = true;
        return;
      }

      // Clear any active error message
      voiceMessage.textContent = '';
      voiceMessage.className = 'status-message';
      voiceSelect.disabled = false;
      voiceSelect.innerHTML = '';

      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.value = index;
        if (voice.default) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });
    }

    // Dynamic voice population
    populateVoiceList();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = populateVoiceList;
    }

    // Start Speech Synthesis
    function startSpeech() {
      const text = textInput.value.trim();

      if (!text || voices.length === 0) return;

      if (synth.speaking || synth.pending) {
        synth.cancel();
      }

      const utterance = new SpeechSynthesisUtterance(text);

      const selectedIndex = voiceSelect.value;
      if (selectedIndex !== "" && voices[selectedIndex]) {
        utterance.voice = voices[selectedIndex];
      }

      utterance.rate = parseFloat(rateInput.value);
      utterance.pitch = parseFloat(pitchInput.value);

      synth.speak(utterance);
    }

    // Stop Speech Synthesis
    function stopSpeech() {
      if (synth.speaking || synth.pending) {
        synth.cancel();
      }
    }

    // Event Listeners
    speakBtn.addEventListener('click', startSpeech);
    stopBtn.addEventListener('click', stopSpeech);

    voiceSelect.addEventListener('change', () => {
      if (synth.speaking) startSpeech();
    });

    rateInput.addEventListener('change', () => {
      rateVal.textContent = rateInput.value;
      if (synth.speaking) startSpeech();
    });

    pitchInput.addEventListener('change', () => {
      pitchVal.textContent = pitchInput.value;
      if (synth.speaking) startSpeech();
    });

    rateInput.addEventListener('input', () => {
      rateVal.textContent = rateInput.value;
    });

    pitchInput.addEventListener('input', () => {
      pitchVal.textContent = pitchInput.value;
    });
  </script>
</body>
</html>
